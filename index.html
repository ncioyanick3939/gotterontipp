<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HockeyPool Schweiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#0A0E1A; --surface:#141C2E; --elevated:#1B2438; --line:#26314A;
    --text:#E8EDF5; --muted:#8B96A9; --faint:#5C6579;
    --red:#E23744; --red-soft:rgba(226,55,68,.14);
    --ice:#38BDF8; --ice-soft:rgba(56,189,248,.14);
    --gold:#F5A623; --green:#2FBF71; --green-soft:rgba(47,191,113,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif;}
  body{overscroll-behavior:none;}
  #root{max-width:460px; margin:0 auto; min-height:100vh; background:var(--ink); position:relative; box-shadow:0 0 80px rgba(0,0,0,.5);}
  .mono{font-family:'Barlow Condensed','Inter',sans-serif; font-feature-settings:"tnum"; letter-spacing:.5px;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted); font-weight:600;}
  .app{padding:0 0 92px 0;}
  /* Header */
  .topbar{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,rgba(10,14,26,.98),rgba(10,14,26,.86)); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; letter-spacing:-.2px;}
  .brand .puck{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--red),#a01722);display:grid;place-items:center;font-size:15px;}
  .balance-chip{display:flex;align-items:center;gap:7px;background:var(--elevated);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;}
  .balance-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  /* Cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .section{padding:16px 16px 4px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .link{color:var(--ice);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;}
  /* Next game hero */
  .hero{margin:16px;border-radius:22px;overflow:hidden;position:relative;background:radial-gradient(120% 100% at 50% 0%,#1c2740 0%,#0f1626 60%);border:1px solid var(--line);}
  .hero-inner{padding:20px 18px;}
  .hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px;}
  .pill.open{background:var(--green-soft);color:var(--green);}
  .pill.locked{background:var(--red-soft);color:var(--red);}
  .pill.live{background:var(--red);color:#fff;}
  .pill.done{background:var(--elevated);color:var(--muted);}
  .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .team-col{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .crest{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;border:1px solid rgba(255,255,255,.1);}
  .team-name{font-size:13px;font-weight:600;line-height:1.1;}
  .team-sub{font-size:11px;color:var(--muted);}
  .vs{font-family:'Barlow Condensed';font-size:20px;color:var(--muted);font-weight:600;}
  .score{font-family:'Barlow Condensed';font-size:40px;font-weight:700;line-height:1;}
  .countdown{margin-top:18px;text-align:center;}
  .cd-time{font-family:'Barlow Condensed';font-size:34px;font-weight:700;letter-spacing:2px;color:var(--text);}
  .cd-time.hot{color:var(--red);}
  .btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .08s ease,filter .15s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--red),#b81e2b);color:#fff;box-shadow:0 6px 20px -6px var(--red);}
  .btn-ghost{background:var(--elevated);color:var(--text);border:1px solid var(--line);}
  .btn-primary:disabled{background:var(--elevated);color:var(--muted);box-shadow:none;cursor:not-allowed;}
  /* rows */
  .rowlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
  .rowlist .row{background:var(--surface);padding:13px 14px;display:flex;align-items:center;gap:12px;}
  .rank-badge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:15px;background:var(--elevated);color:var(--muted);flex-shrink:0;}
  .rank-badge.g1{background:linear-gradient(135deg,#f5c542,#e0961f);color:#231a00;}
  .rank-badge.g2{background:linear-gradient(135deg,#cfd6e0,#9aa4b3);color:#141a24;}
  .rank-badge.g3{background:linear-gradient(135deg,#d68a5b,#a45a2e);color:#1c0f06;}
  .avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--elevated);flex-shrink:0;}
  .grow{flex:1;min-width:0;}
  .row-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--muted);}
  .row-val{font-family:'Barlow Condensed';font-weight:700;font-size:19px;}
  /* pool bar */
  .poolbar{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--elevated);}
  .poolbar .a{background:linear-gradient(90deg,#2563eb,#3b82f6);}
  .poolbar .b{background:linear-gradient(90deg,#dc2626,#ef4444);}
  /* nav */
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(13,18,30,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;}
  .navbtn{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:color .15s;}
  .navbtn.active{color:var(--text);}
  .navbtn .ico{font-size:19px;line-height:1;}
  .navbtn.active .ico{filter:drop-shadow(0 0 8px var(--ice));}
  /* stake grid */
  .stakegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stake{background:var(--elevated);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:20px;cursor:pointer;color:var(--text);}
  .stake.sel{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .teambtn{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);}
  .teambtn.sel{border-color:var(--ice);background:var(--ice-soft);}
  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--line);padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grabber{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px;}
  /* pos tabs / chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--elevated);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
  .chip.active{background:var(--text);color:var(--ink);border-color:var(--text);}
  /* player market card */
  .pcard{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .pnum{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:17px;flex-shrink:0;color:#fff;}
  .pop-wrap{display:flex;align-items:center;gap:8px;}
  .pop-track{width:52px;height:6px;border-radius:99px;background:var(--elevated);overflow:hidden;}
  .pop-fill{height:100%;background:linear-gradient(90deg,var(--ice),#7dd3fc);}
  .price{font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:var(--gold);}
  .add-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--elevated);color:var(--text);font-size:19px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;font-family:'Barlow Condensed';}
  .add-btn.owned{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .add-btn:disabled{opacity:.35;cursor:not-allowed;}
  /* rink */
  .rink{background:linear-gradient(180deg,#0e1830,#0a1122);border:1px solid var(--line);border-radius:18px;padding:18px 10px;position:relative;overflow:hidden;}
  .rink:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--red);opacity:.35;}
  .rink-line{display:flex;justify-content:center;gap:10px;margin:14px 0;position:relative;z-index:2;flex-wrap:wrap;}
  .slot{width:64px;text-align:center;}
  .slot .puckicon{width:44px;height:44px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;font-size:20px;border:2px solid rgba(255,255,255,.14);background:var(--elevated);}
  .slot.filled .puckicon{border-color:var(--ice);background:var(--ice-soft);}
  .slot small{font-size:10px;color:var(--muted);display:block;line-height:1.2;}
  .slot b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* stat grid */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat .n{font-family:'Barlow Condensed';font-weight:700;font-size:26px;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.6px;}
  .ach{display:flex;gap:12px;align-items:center;padding:13px 14px;}
  .ach .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--elevated);flex-shrink:0;}
  .ach.locked{opacity:.4;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .banner{margin:14px 16px 0;padding:11px 14px;border-radius:12px;background:var(--ice-soft);border:1px solid rgba(56,189,248,.3);font-size:12.5px;color:#bfe3fb;display:flex;gap:9px;align-items:flex-start;}
  .tag-outcome{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .win{background:var(--green-soft);color:var(--green);}
  .lose{background:var(--red-soft);color:var(--red);}
  .open{background:var(--ice-soft);color:var(--ice);}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .muted{color:var(--muted);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Helpers ---------- */
const fmt = n => Math.round(n).toLocaleString('de-CH');   // 10'000
const PRICE_CONFIG = { base:300, range:1700, exponent:1.3, roundTo:50 };
function priceFromPopularity(score){
  const {base,range,exponent,roundTo}=PRICE_CONFIG;
  const raw = base + Math.pow(score/100, exponent)*range;
  return Math.round(raw/roundTo)*roundTo;
}

/* ---------- Mock-Daten ---------- */
const TEAMS = {
  ZSC:{name:"ZSC Lions", short:"ZSC", color:"#2563eb", tag:"🦁"},
  SCB:{name:"SC Bern", short:"SCB", color:"#dc2626", tag:"🐻"},
  ZUG:{name:"EV Zug", short:"ZUG", color:"#0ea5e9", tag:"⚡"},
  DAV:{name:"HC Davos", short:"HCD", color:"#eab308", tag:"🏔️"},
  LAU:{name:"Lausanne HC", short:"LHC", color:"#1e40af", tag:"🦅"},
  FRI:{name:"Fribourg-Gottéron", short:"FRI", color:"#0f766e", tag:"🐉"},
  GSHC:{name:"Genève-Servette", short:"GSHC", color:"#7c1d1d", tag:"🦅"},
  BIE:{name:"EHC Biel", short:"BIE", color:"#eab308", tag:"🐝"},
};

// Fiktive Spieler (keine realen Personendaten)
let PID=0;
const mkP=(fn,ln,team,pos,num,pop,fav,teams,potg)=>({id:++PID,firstName:fn,lastName:ln,team,pos,num,pop,fav,teams,potg,trend:Math.round((Math.random()*30-8))});
const PLAYERS = [
  mkP("Nino","Berger","ZSC","F",96,92,42,127,8),
  mkP("Luca","Weber","SCB","F",71,88,31,98,5),
  mkP("Elias","Moser","ZUG","F",29,84,22,86,4),
  mkP("Timo","Frei","DAV","D",6,81,18,74,2),
  mkP("Jan","Keller","LAU","F",17,79,15,69,3),
  mkP("Noah","Steiner","FRI","G",30,77,26,81,6),
  mkP("Leon","Baumann","ZSC","D",44,74,11,58,1),
  mkP("Simon","Roth","GSHC","F",22,71,9,52,2),
  mkP("Kevin","Meier","BIE","F",88,68,7,47,1),
  mkP("Yves","Schmid","ZUG","G",1,66,14,61,3),
  mkP("Marco","Graf","SCB","D",55,63,6,44,0),
  mkP("Fabio","Lehmann","DAV","F",93,59,5,39,1),
  mkP("Sven","Widmer","LAU","D",8,54,4,33,0),
  mkP("Dario","Huber","FRI","F",11,52,8,41,2),
  mkP("Robin","Wyss","ZSC","G",35,49,10,45,1),
  mkP("Aaron","Suter","GSHC","D",21,46,3,28,0),
  mkP("Colin","Bühler","BIE","D",4,43,2,22,0),
  mkP("Mika","Zimmermann","ZUG","F",67,41,3,26,1),
  mkP("Dean","Fischer","DAV","F",19,38,2,19,0),
  mkP("Loris","Brunner","LAU","G",29,36,4,24,0),
  mkP("Nael","Gerber","SCB","F",26,33,1,14,0),
  mkP("Ryan","Marti","FRI","D",77,28,1,11,0),
  mkP("Levin","Kunz","GSHC","F",14,24,1,9,0),
  mkP("Elia","Pfister","BIE","F",90,19,0,6,0),
].map(p=>({...p, price:priceFromPopularity(p.pop)}));

const posLabel = {G:"Torhüter", D:"Verteidiger", F:"Stürmer"};

const now = Date.now();
const GAMES = [
  {id:1, home:"ZSC", away:"SCB", start:now+55*60000, status:"OPEN",
   pool:{ZSC:350, SCB:750}, tips:[
     {u:"Luca",t:"ZSC",amt:250},{u:"Marco",t:"SCB",amt:500},
     {u:"Sarah",t:"ZSC",amt:100},{u:"Jonas",t:"SCB",amt:250}], myTip:{t:"ZSC",amt:250}},
  {id:2, home:"DAV", away:"ZUG", start:now+3*3600000, status:"OPEN", pool:{DAV:420, ZUG:180}, tips:[], myTip:null},
  {id:3, home:"LAU", away:"FRI", start:now+26*3600000, status:"OPEN", pool:{LAU:0, FRI:0}, tips:[], myTip:null},
  {id:4, home:"GSHC", away:"BIE", start:now+50*60000, status:"LIVE", hs:2, as:1, pool:{GSHC:600,BIE:400}, tips:[], myTip:{t:"GSHC",amt:200}},
  {id:5, home:"ZUG", away:"SCB", start:now-2*3600000, status:"FINISHED", hs:4, as:2, pool:{ZUG:900,SCB:300}, tips:[], myTip:{t:"ZUG",amt:100}, won:true},
  {id:6, home:"FRI", away:"DAV", start:now-26*3600000, status:"FINISHED", hs:1, as:3, pool:{FRI:500,DAV:700}, tips:[], myTip:{t:"FRI",amt:150}, won:false},
];

const MEMBERS = [
  {name:"Luca", pts:8450, streak:5, me:true},
  {name:"Marco", pts:8120, streak:2},
  {name:"Sarah", pts:7950, streak:3},
  {name:"Jonas", pts:7500, streak:0},
  {name:"Nina", pts:7180, streak:1},
  {name:"Timo", pts:6900, streak:0},
  {name:"Aline", pts:6540, streak:4},
  {name:"Ben", pts:6210, streak:0},
];

const ROSTER_RULES = { G:2, D:5, F:8 };
const START_BUDGET = 10000;

const ACHIEVEMENTS = [
  {icon:"🔥", name:"Hot Hand", desc:"5 richtige Tipps in Serie", got:true},
  {icon:"🎯", name:"Scharfschütze", desc:"10 richtige Tipps", got:true},
  {icon:"❤️", name:"Fan", desc:"Lieblingsspieler gewählt", got:true},
  {icon:"🧠", name:"Fantasy Manager", desc:"Fantasy-Team erstellt", got:false},
  {icon:"📈", name:"Scout", desc:"Spieler vor grossem Anstieg gewählt", got:false},
  {icon:"🏆", name:"Champion", desc:"Saison gewonnen", got:false},
];

/* ---------- kleine Bausteine ---------- */
function Crest({code, size=56}){
  const t=TEAMS[code];
  return <div className="crest" style={{width:size,height:size,background:t.color+"22",boxShadow:`inset 0 0 0 1px ${t.color}55`,fontSize:size*0.5}}>{t.tag}</div>;
}
function StatusPill({s}){
  const map={OPEN:["open","🟢 Offen"],LOCKED:["locked","🔒 Geschlossen"],LIVE:["live","● Live"],FINISHED:["done","Beendet"],UPCOMING:["open","Bald"]};
  const [cls,label]=map[s]||["done",s];
  return <span className={"pill "+cls}>{label}</span>;
}
function useCountdown(target){
  const [t,setT]=useState(target-Date.now());
  useEffect(()=>{const i=setInterval(()=>setT(target-Date.now()),1000);return()=>clearInterval(i);},[target]);
  return t;
}
function fmtCd(ms){
  if(ms<=0) return "00:00:00";
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  const p=x=>String(x).padStart(2,"0");
  return `${p(h)}:${p(m)}:${p(ss)}`;
}
// Tipp-Schluss = 60 Min vor Spielbeginn
const lockTime = g => g.start - 60*60000;
const isOpen = g => g.status==="OPEN" && Date.now() < lockTime(g);

/* ============ SCREENS ============ */

function Dashboard({state, go, openTip}){
  const next = GAMES.find(g=>g.status==="OPEN"||g.status==="LIVE");
  const cd = useCountdown(lockTime(next));
  const open = isOpen(next);
  const fantasyValue = state.roster.reduce((s,id)=>s+PLAYERS.find(p=>p.id===id).price,0);
  return (
    <div>
      <div className="section" style={{paddingTop:18}}>
        <div className="eyebrow">Hockeyrunde 2026/27</div>
        <h1 style={{fontSize:26,fontWeight:700,letterSpacing:-.5,marginTop:4}}>Hallo Luca 👋</h1>
      </div>

      {/* Punktestand */}
      <div className="section" style={{paddingTop:6}}>
        <div className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"radial-gradient(120% 140% at 100% 0%,#1d2a44,#131b2c)"}}>
          <div>
            <div className="eyebrow">Dein Tipp-Guthaben</div>
            <div className="mono" style={{fontSize:38,fontWeight:700,marginTop:2}}>{fmt(state.balance)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div className="eyebrow">Fantasy-Wert</div>
            <div className="mono" style={{fontSize:24,fontWeight:700,color:"var(--gold)"}}>{fmt(fantasyValue)}</div>
            <div className="row-sub">/ {fmt(START_BUDGET)}</div>
          </div>
        </div>
      </div>

      {/* Nächstes Spiel */}
      <div className="hero">
        <div className="hero-inner">
          <div className="hero-top">
            <span className="eyebrow">{next.status==="LIVE"?"Läuft gerade":"Nächstes Spiel · Heute"}</span>
            <StatusPill s={next.status}/>
          </div>
          <div className="matchup">
            <div className="team-col">
              <Crest code={next.home}/>
              <div><div className="team-name">{TEAMS[next.home].name}</div><div className="team-sub">Heim</div></div>
            </div>
            {next.status==="LIVE"
              ? <div style={{textAlign:"center"}}><div className="score">{next.hs}:{next.as}</div><div className="team-sub">2. Drittel</div></div>

function Games({state, openTip}){
  const [filter,setFilter]=useState("all");
  const list = GAMES.filter(g=>{
    if(filter==="open") return g.status==="OPEN"||g.status==="LIVE";
    if(filter==="done") return g.status==="FINISHED";
    return true;
  });
  return (
    <div>
      <div className="section" style={{paddingTop:18}}><h1 style={{fontSize:24,fontWeight:700}}>Spiele</h1></div>
      <div className="section" style={{paddingTop:4,paddingBottom:8}}>
        <div className="chips">
          {[["all","Alle"],["open","Offen & Live"],["done","Beendet"]].map(([k,l])=>(
            <button key={k} className={"chip "+(filter===k?"active":"")} onClick={()=>setFilter(k)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="section" style={{display:"flex",flexDirection:"column",gap:12,paddingBottom:20}}>
        {list.map(g=><GameCard key={g.id} g={g} openTip={openTip}/>)}
      </div>
    </div>

}

function GameCard({g, openTip}){
  const total=(g.pool[g.home]||0)+(g.pool[g.away]||0);
  const pa = total? (g.pool[g.home]/total*100):50;
  const open=isOpen(g);
  const cd=useCountdown(lockTime(g));
  return (
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span className="eyebrow">National League</span>
        <StatusPill s={open?"OPEN":(g.status==="OPEN"?"LOCKED":g.status)}/>
      </div>
      <div className="matchup" style={{marginBottom:12}}>
        <div className="team-col"><Crest code={g.home} size={46}/><div className="team-name">{TEAMS[g.home].short}</div></div>
        {g.status==="FINISHED"||g.status==="LIVE"
          ? <div style={{textAlign:"center"}}><div className="score" style={{fontSize:30}}>{g.hs}:{g.as}</div>{g.status==="LIVE"&&<div className="team-sub" style={{color:"var(--red)"}}>Live</div>}</div>
          : <div style={{textAlign:"center"}}><div className="vs">VS</div><div className="team-sub" style={{marginTop:4}}>{new Date(g.start).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div></div>}
        <div className="team-col"><Crest code={g.away} size={46}/><div className="team-name">{TEAMS[g.away].short}</div></div>
      </div>

      {total>0 && <>
        <div className="poolbar"><div className="a" style={{width:pa+"%"}}></div><div className="b" style={{width:(100-pa)+"%"}}></div></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginTop:6,color:"var(--muted)"}}>
          <span>{TEAMS[g.home].short} {pa.toFixed(1)}%</span>
          <span>Pool {fmt(total)}</span>
          <span>{(100-pa).toFixed(1)}% {TEAMS[g.away].short}</span>
        </div>
      </>}

      {/* Gruppen-Tipps */}
      {g.tips.length>0 && <>
        <div className="divider"></div>
        <div className="eyebrow" style={{marginBottom:8}}>Tipps der Gruppe</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {g.tips.map((t,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,fontSize:13}}>
              <div className="avatar" style={{width:26,height:26,fontSize:12}}>{t.u[0]}</div>
              <span className="grow" style={{fontWeight:600}}>{t.u}</span>
              <span className="muted">{TEAMS[t.t].tag} {TEAMS[t.t].short}</span>
              <span className="mono" style={{fontWeight:700,minWidth:44,textAlign:"right"}}>{fmt(t.amt)}</span>
            </div>
          ))}
        </div>
      </>}

      <div style={{marginTop:14}}>
        {g.status==="FINISHED"
          ? <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span className="muted" style={{fontSize:13}}>Dein Tipp: {g.myTip?`${TEAMS[g.myTip.t].tag} ${fmt(g.myTip.amt)}`:"—"}</span>
              {g.myTip && <span className={"tag-outcome "+(g.won?"win":"lose")}>{g.won?`✅ +${fmt(g.myTip.amt)}`:`❌ -${fmt(g.myTip.amt)}`}</span>}
            </div>
          : g.myTip
            ? <div className="card" style={{background:"var(--elevated)",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px"}}>
                <span style={{fontWeight:600,fontSize:13}}>✔ Getippt: {TEAMS[g.myTip.t].short}</span>
                <span className="mono" style={{fontWeight:700}}>{fmt(g.myTip.amt)}</span>
              </div>
            : open
              ? <button className="btn btn-primary" onClick={()=>openTip(g)}>Jetzt tippen</button>
              : <button className="btn btn-primary" disabled>🔒 Tipp-Schluss erreicht</button>}
      </div>
    </div>
  );
}

/* Tipp-Sheet */
function TipSheet({g, balance, onClose, onConfirm}){
  const [team,setTeam]=useState(null);
  const [amt,setAmt]=useState(null);
  const [custom,setCustom]=useState("");
  const [step,setStep]=useState(1);
  const stake = custom!==""? parseInt(custom||0,10) : amt;
  const valid = team && stake>0 && stake<=balance;
  return (
    <div className="backdrop" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grabber"></div>
        {step===1 ? <>
          <div style={{textAlign:"center",marginBottom:16}}>
            <div className="eyebrow">Wer gewinnt?</div>
            <div style={{fontWeight:700,fontSize:17,marginTop:4}}>{TEAMS[g.home].name} vs. {TEAMS[g.away].name}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
            {[g.home,g.away].map(code=>(
              <button key={code} className={"teambtn "+(team===code?"sel":"")} onClick={()=>setTeam(code)}>
                <Crest code={code} size={44}/>
                <div style={{fontWeight:600,fontSize:13,textAlign:"center"}}>{TEAMS[code].name}</div>
              </button>
            ))}
          </div>
          <div className="eyebrow" style={{marginBottom:8}}>Einsatz</div>
          <div className="stakegrid" style={{marginBottom:10}}>
            {[10,25,50,100,250,500].map(v=>(
              <button key={v} className={"stake "+(amt===v&&custom===""?"sel":"")} onClick={()=>{setAmt(v);setCustom("");}}>{v}</button>
            ))}
          </div>
          <input inputMode="numeric" placeholder="Eigener Betrag" value={custom}
            onChange={e=>{setCustom(e.target.value.replace(/\D/g,""));setAmt(null);}}
            style={{width:"100%",padding:"13px 14px",borderRadius:12,background:"var(--elevated)",border:"1px solid var(--line)",color:"var(--text)",fontSize:15,fontFamily:"inherit",marginBottom:14}}/>
          <div className="card" style={{background:"var(--elevated)",marginBottom:14}}>
            <Line l="Aktuelles Guthaben" v={fmt(balance)}/>
            <Line l="Einsatz" v={stake?fmt(stake):"–"}/>
            <div className="divider" style={{margin:"10px 0"}}></div>
            <Line l="Verbleibend" v={stake?fmt(balance-stake):fmt(balance)} strong/>
          </div>
          {stake>balance && <div style={{color:"var(--red)",fontSize:12.5,marginBottom:10}}>Nicht genug Guthaben.</div>}
          <button className="btn btn-primary" disabled={!valid} onClick={()=>setStep(2)}>Weiter</button>
        </> : <>
          <div style={{textAlign:"center",padding:"10px 0 20px"}}>
            <div style={{fontSize:40,marginBottom:8}}>{TEAMS[team].tag}</div>
            <div style={{fontSize:18,fontWeight:700}}>Du setzt {fmt(stake)} Punkte</div>
            <div className="muted" style={{marginTop:4}}>auf {TEAMS[team].name}</div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setStep(1)}>Abbrechen</button>
            <button className="btn btn-primary" style={{flex:1}} onClick={()=>onConfirm(g,team,stake)}>Bestätigen</button>
          </div>
        </>}
      </div>
    </div>
  );
}
const Line=({l,v,strong})=>(
  <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0"}}>
    <span className="muted" style={{fontSize:13}}>{l}</span>
    <span className="mono" style={{fontWeight:700,fontSize:strong?18:15,color:strong?"var(--gold)":"var(--text)"}}>{v}</span>
  </div>
);

/* Fantasy */
function Fantasy({state, dispatch, toast, openPlayer}){
  const [tab,setTab]=useState("team");
  const spent = state.roster.reduce((s,id)=>s+PLAYERS.find(p=>p.id===id).price,0);
  const left = START_BUDGET - spent;
  const counts = {G:0,D:0,F:0};
  state.roster.forEach(id=>counts[PLAYERS.find(p=>p.id===id).pos]++);

  return (
    <div>
      <div className="section" style={{paddingTop:18}}><h1 style={{fontSize:24,fontWeight:700}}>Fantasy</h1></div>

      {/* Budget */}
      <div className="section" style={{paddingTop:4}}>
        <div className="card" style={{display:"flex",justifyContent:"space-between"}}>
          <div><div className="eyebrow">Budget</div><div className="mono" style={{fontSize:22,fontWeight:700}}>{fmt(START_BUDGET)}</div></div>
          <div style={{textAlign:"center"}}><div className="eyebrow">Ausgegeben</div><div className="mono" style={{fontSize:22,fontWeight:700}}>{fmt(spent)}</div></div>
          <div style={{textAlign:"right"}}><div className="eyebrow">Übrig</div><div className="mono" style={{fontSize:22,fontWeight:700,color:left<0?"var(--red)":"var(--green)"}}>{fmt(left)}</div></div>
        </div>
      </div>

      <div className="section" style={{paddingTop:8,paddingBottom:8}}>
        <div className="chips">
          {[["team","🧠 Mein Team"],["market","🔄 Markt"],["transfers","📈 Transfermarkt"]].map(([k,l])=>(
            <button key={k} className={"chip "+(tab===k?"active":"")} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </div>
      </div>

      {tab==="team" && <TeamView state={state} counts={counts} dispatch={dispatch} toast={toast} openPlayer={openPlayer}/>}
      {tab==="market" && <Market state={state} counts={counts} left={left} dispatch={dispatch} toast={toast} openPlayer={openPlayer}/>}
      {tab==="transfers" && <Transfers openPlayer={openPlayer}/>}
    </div>
  );
}

function TeamView({state, counts, dispatch, toast, openPlayer}){
  const get = pos => state.roster.map(id=>PLAYERS.find(p=>p.id===id)).filter(p=>p.pos===pos);
  const Slot = ({p, pos})=>(
    <div className={"slot "+(p?"filled":"")} onClick={()=>p&&openPlayer(p.id)}>
      <div className="puckicon">{p? "🏒" : (pos==="G"?"🥅":"＋")}</div>
      {p? <><b>{p.lastName}</b><small>{TEAMS[p.team].short} · {fmt(p.price)}</small></>
        : <small>{posLabel[pos]}</small>}
    </div>
  );
  const line = (pos)=> {
    const filled=get(pos); const total=ROSTER_RULES[pos];
    const arr=[...filled, ...Array(Math.max(0,total-filled.length)).fill(null)];
    return arr.map((p,i)=><Slot key={i} p={p} pos={pos}/>);
  };
  return (
    <div className="section" style={{paddingBottom:20}}>
      <div className="rink">
        <div style={{textAlign:"center",marginBottom:6}} className="eyebrow">Torhüter {counts.G}/{ROSTER_RULES.G}</div>
        <div className="rink-line">{line("G")}</div>
        <div style={{textAlign:"center",marginBottom:6}} className="eyebrow">Verteidigung {counts.D}/{ROSTER_RULES.D}</div>
        <div className="rink-line">{line("D")}</div>
        <div style={{textAlign:"center",marginBottom:6}} className="eyebrow">Sturm {counts.F}/{ROSTER_RULES.F}</div>
        <div className="rink-line">{line("F")}</div>
      </div>
      {state.roster.length>0 && <button className="btn btn-ghost" style={{marginTop:14}} onClick={()=>{dispatch({type:"clear"});toast("Team zurückgesetzt");}}>Team leeren</button>}
      <div className="banner" style={{marginLeft:0,marginRight:0}}>ℹ️ <span>Tippe auf ＋ Slots oder öffne den <b>Markt</b>, um Spieler hinzuzufügen. Der Server prüft Budget, Position und Anzahl (hier als Demo im Frontend).</span></div>
    </div>
  );
}

function Market({state, counts, left, dispatch, toast, openPlayer}){
  const [pos,setPos]=useState("all");
  const list = PLAYERS.filter(p=>pos==="all"||p.pos===pos).sort((a,b)=>b.pop-a.pop);
  return (
    <div className="section" style={{paddingBottom:20}}>
      <div className="chips" style={{marginBottom:12}}>
        {[["all","Alle"],["G","Torhüter"],["D","Verteidiger"],["F","Stürmer"]].map(([k,l])=>(
          <button key={k} className={"chip "+(pos===k?"active":"")} onClick={()=>setPos(k)}>{l}</button>
        ))}
      </div>
      <div className="rowlist">
        {list.map(p=>{
          const owned=state.roster.includes(p.id);
          const full=counts[p.pos]>=ROSTER_RULES[p.pos];
          const tooExp=p.price>left;
          const disabled=!owned && (full||tooExp);
          return (
            <div className="row pcard" key={p.id}>
              <div className="pnum" style={{background:TEAMS[p.team].color}} onClick={()=>openPlayer(p.id)}>{p.num}</div>
              <div className="grow" onClick={()=>openPlayer(p.id)}>
                <div className="row-title">{p.firstName} {p.lastName}</div>
                <div className="pop-wrap">
                  <div className="pop-track"><div className="pop-fill" style={{width:p.pop+"%"}}></div></div>
                  <span className="row-sub">Beliebtheit {p.pop}</span>
                </div>
              </div>
              <div style={{textAlign:"right",marginRight:4}}>
                <div className="price">{fmt(p.price)}</div>
                <div className="row-sub" style={{color:p.trend>=0?"var(--green)":"var(--red)"}}>{p.trend>=0?"▲":"▼"} {Math.abs(p.trend)}%</div>
              </div>
              <button className={"add-btn "+(owned?"owned":"")} disabled={disabled}
                onClick={()=>{
                  if(owned){dispatch({type:"remove",id:p.id});toast(`${p.lastName} entfernt`);}
                  else{dispatch({type:"add",id:p.id});toast(`${p.lastName} ins Team ✓`);}
                }}>{owned?"✓":"＋"}</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Transfers({openPlayer}){
  const risers=[...PLAYERS].sort((a,b)=>b.trend-a.trend).slice(0,3);
  const fallers=[...PLAYERS].sort((a,b)=>a.trend-b.trend).slice(0,3);
  const popular=[...PLAYERS].sort((a,b)=>b.teams-a.teams).slice(0,3);
  const Block=({title,arr,valFn,color})=>(
    <div className="section" style={{paddingTop:0}}>
      <div className="section-head"><h2 style={{fontSize:15}}>{title}</h2></div>
      <div className="rowlist">
        {arr.map(p=>(
          <div className="row" key={p.id} onClick={()=>openPlayer(p.id)}>
            <div className="pnum" style={{width:32,height:32,fontSize:14,background:TEAMS[p.team].color}}>{p.num}</div>
            <div className="grow"><div className="row-title">{p.firstName} {p.lastName}</div><div className="row-sub">{TEAMS[p.team].short}</div></div>
            <div className="mono" style={{fontWeight:700,color}}>{valFn(p)}</div>
          </div>
        ))}
      </div>
    </div>
  );
  return <div style={{paddingBottom:20}}>
    <Block title="📈 Grösste Aufsteiger" arr={risers} valFn={p=>"+"+p.trend+"%"} color="var(--green)"/>
    <Block title="📉 Grösste Verlierer" arr={fallers} valFn={p=>p.trend+"%"} color="var(--red)"/>
    <Block title="🔥 Meistgewählt" arr={popular} valFn={p=>p.teams+" Teams"} color="var(--gold)"/>
  </div>;
}

            return (
              <div className="row" key={g.id}>
                <div className="grow"><div className="row-title">{TEAMS[g.home].short} – {TEAMS[g.away].short}</div><div className="row-sub">{TEAMS[g.myTip.t].tag} {TEAMS[g.myTip.t].short} · {fmt(g.myTip.amt)} Pkt</div></div>
                <span className={"tag-outcome "+out}>{label}</span>
              </div>
            );
          })}
        </div>
      </div>

      {/* Achievements */}
      <div className="section" style={{paddingBottom:20}}>
        <div className="section-head"><h2>Erfolge</h2><span className="muted" style={{fontSize:12}}>{ACHIEVEMENTS.filter(a=>a.got).length}/{ACHIEVEMENTS.length}</span></div>
        <div className="rowlist">
          {ACHIEVEMENTS.map(a=>(
            <div className={"row ach "+(a.got?"":"locked")} key={a.name}>
              <div className="ico">{a.icon}</div>
              <div className="grow"><div className="row-title">{a.name}</div><div className="row-sub">{a.desc}</div></div>
              {a.got && <span style={{color:"var(--green)"}}>✓</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* Spieler-Detail */
function PlayerSheet({id, state, dispatch, toast, onClose}){
  const p=PLAYERS.find(x=>x.id===id);
  const owned=state.roster.includes(p.id);
  const isFav=state.favorite===p.id;
  return (
    <div className="backdrop" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grabber"></div>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}>
          <div className="pnum" style={{width:54,height:54,fontSize:22,background:TEAMS[p.team].color}}>{p.num}</div>
          <div><div style={{fontWeight:700,fontSize:20}}>{p.firstName} {p.lastName}</div><div className="muted">{TEAMS[p.team].name} · {posLabel[p.pos]}</div></div>
        </div>
        <div className="statgrid" style={{marginBottom:14}}>
          <div className="stat"><div className="n" style={{color:"var(--ice)"}}>{p.pop}<span style={{fontSize:14,color:"var(--muted)"}}>/100</span></div><div className="l">Popularity Score</div></div>
          <div className="stat"><div className="n" style={{color:"var(--gold)"}}>{fmt(p.price)}</div><div className="l">Fantasy-Preis</div></div>
          <div className="stat"><div className="n">{p.teams}</div><div className="l">Fantasy-Teams</div></div>
          <div className="stat"><div className="n">{p.fav} ❤️</div><div className="l">Lieblingsspieler</div></div>
        </div>
        <div className="card" style={{background:"var(--elevated)",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span className="muted">Trend diese Woche</span>
            <span style={{fontWeight:700,color:p.trend>=0?"var(--green)":"var(--red)"}}>{p.trend>=0?"▲ +":"▼ "}{p.trend}%</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginTop:8}}>
            <span className="muted">Spieler des Spiels</span><span style={{fontWeight:700}}>{p.potg}×</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className={"btn "+(isFav?"btn-primary":"btn-ghost")} style={{flex:1}}
            onClick={()=>{dispatch({type:"fav",id:isFav?null:p.id});toast(isFav?"Lieblingsspieler entfernt":`❤️ ${p.lastName} ist dein Liebling`);}}>
            {isFav?"❤️ Liebling":"♡ Als Liebling"}
          </button>
          <button className={"btn "+(owned?"btn-ghost":"btn-primary")} style={{flex:1}}
            onClick={()=>{
              if(owned){dispatch({type:"remove",id:p.id});toast(`${p.lastName} entfernt`);}
              else{dispatch({type:"add",id:p.id});toast(`${p.lastName} ins Team ✓`);}
            }}>{owned?"− Entfernen":"＋ Ins Team"}</button>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function reducer(state, a){
  switch(a.type){
    case "bet": return {...state, balance: state.balance - a.amt};
    case "add": {
      const p=PLAYERS.find(x=>x.id===a.id);
      const counts={G:0,D:0,F:0}; state.roster.forEach(id=>counts[PLAYERS.find(x=>x.id===id).pos]++);
      const spent=state.roster.reduce((s,id)=>s+PLAYERS.find(x=>x.id===id).price,0);
      if(state.roster.includes(a.id)) return state;
      if(counts[p.pos]>=ROSTER_RULES[p.pos]) return state;
      if(spent+p.price>START_BUDGET) return state;
      return {...state, roster:[...state.roster, a.id]};
    }
    case "remove": return {...state, roster: state.roster.filter(id=>id!==a.id)};
    case "clear": return {...state, roster:[]};
    case "fav": return {...state, favorite:a.id};
    default: return state;
  }
}

function App(){
  const [tab,setTab]=useState("home");
  const [state,dispatch]=React.useReducer(reducer,{balance:7850, roster:[1,6], favorite:1});
  const [tipGame,setTipGame]=useState(null);
  const [playerId,setPlayerId]=useState(null);
  const [toastMsg,setToastMsg]=useState(null);
  const toast=(m)=>{setToastMsg(m); setTimeout(()=>setToastMsg(null),1800);};

  const confirmTip=(g,team,amt)=>{
    dispatch({type:"bet",amt});
    g.myTip={t:team,amt};                 // Demo: lokal setzen
    g.pool[team]=(g.pool[team]||0)+amt;
    g.tips=[...g.tips,{u:"Luca",t:team,amt}];
    setTipGame(null);
    toast(`Tipp abgegeben: ${amt} auf ${TEAMS[team].short}`);
  };

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand"><span className="puck">🏒</span> HockeyPool</div>
        <div className="balance-chip"><span className="dot"></span> {fmt(state.balance)}</div>
      </div>

      {tab==="home" && <Dashboard state={state} go={setTab} openTip={setTipGame}/>}
      {tab==="games" && <Games state={state} openTip={setTipGame}/>}
      {tab==="fantasy" && <Fantasy state={state} dispatch={dispatch} toast={toast} openPlayer={setPlayerId}/>}
      {tab==="rank" && <Ranking/>}
      {tab==="profile" && <Profile state={state} dispatch={dispatch} toast={toast} openPlayer={setPlayerId}/>}

      <div className="bottomnav">
        {[["home","🏠","Übersicht"],["games","🏒","Spiele"],["fantasy","🧠","Fantasy"],["rank","🏆","Rangliste"],["profile","👤","Profil"]].map(([k,ic,l])=>(
          <button key={k} className={"navbtn "+(tab===k?"active":"")} onClick={()=>setTab(k)}>
            <span className="ico">{ic}</span>{l}
          </button>
        ))}
      </div>

      {tipGame && <TipSheet g={tipGame} balance={state.balance} onClose={()=>setTipGame(null)} onConfirm={confirmTip}/>}
      {playerId && <PlayerSheet id={playerId} state={state} dispatch={dispatch} toast={toast} onClose={()=>setPlayerId(null)}/>}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
