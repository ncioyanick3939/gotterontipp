<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HockeyPool Schweiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#0A0E1A; --surface:#141C2E; --elevated:#1B2438; --line:#26314A;
    --text:#E8EDF5; --muted:#8B96A9; --faint:#5C6579;
    --red:#E23744; --red-soft:rgba(226,55,68,.14);
    --ice:#38BDF8; --ice-soft:rgba(56,189,248,.14);
    --gold:#F5A623; --green:#2FBF71; --green-soft:rgba(47,191,113,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif;}
  body{overscroll-behavior:none;}
  #root{max-width:460px; margin:0 auto; min-height:100vh; background:var(--ink); position:relative; box-shadow:0 0 80px rgba(0,0,0,.5);}
  .mono{font-family:'Barlow Condensed','Inter',sans-serif; font-feature-settings:"tnum"; letter-spacing:.5px;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted); font-weight:600;}
  input,button{font-family:inherit;}
  .app{padding:0 0 92px 0;}
  .topbar{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,rgba(10,14,26,.98),rgba(10,14,26,.86)); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; letter-spacing:-.2px;}
  .brand .puck{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--red),#a01722);display:grid;place-items:center;font-size:15px;}
  .balance-chip{display:flex;align-items:center;gap:7px;background:var(--elevated);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;}
  .balance-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .section{padding:16px 16px 4px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .link{color:var(--ice);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;}
  .hero{margin:16px;border-radius:22px;overflow:hidden;position:relative;background:radial-gradient(120% 100% at 50% 0%,#1c2740 0%,#0f1626 60%);border:1px solid var(--line);}
  .hero-inner{padding:20px 18px;}
  .hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px;}
  .pill.open{background:var(--green-soft);color:var(--green);}
  .pill.locked{background:var(--red-soft);color:var(--red);}
  .pill.live{background:var(--red);color:#fff;}
  .pill.done{background:var(--elevated);color:var(--muted);}
  .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .team-col{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .crest{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;border:1px solid rgba(255,255,255,.1);}
  .team-name{font-size:13px;font-weight:600;line-height:1.1;}
  .team-sub{font-size:11px;color:var(--muted);}
  .vs{font-family:'Barlow Condensed';font-size:20px;color:var(--muted);font-weight:600;}
  .score{font-family:'Barlow Condensed';font-size:40px;font-weight:700;line-height:1;}
  .countdown{margin-top:18px;text-align:center;}
  .cd-time{font-family:'Barlow Condensed';font-size:34px;font-weight:700;letter-spacing:2px;}
  .cd-time.hot{color:var(--red);}
  .btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s ease,filter .15s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--red),#b81e2b);color:#fff;box-shadow:0 6px 20px -6px var(--red);}
  .btn-ghost{background:var(--elevated);color:var(--text);border:1px solid var(--line);}
  .btn-primary:disabled{background:var(--elevated);color:var(--muted);box-shadow:none;cursor:not-allowed;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .input{width:100%;padding:13px 14px;border-radius:12px;background:var(--elevated);border:1px solid var(--line);color:var(--text);font-size:15px;transition:border .15s;}
  .input:focus{outline:none;border-color:var(--ice);}
  .input.err{border-color:var(--red);}
  .errmsg{color:var(--red);font-size:12px;margin-top:5px;}
  .rowlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
  .rowlist .row{background:var(--surface);padding:13px 14px;display:flex;align-items:center;gap:12px;}
  .rank-badge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:15px;background:var(--elevated);color:var(--muted);flex-shrink:0;}
  .rank-badge.g1{background:linear-gradient(135deg,#f5c542,#e0961f);color:#231a00;}
  .rank-badge.g2{background:linear-gradient(135deg,#cfd6e0,#9aa4b3);color:#141a24;}
  .rank-badge.g3{background:linear-gradient(135deg,#d68a5b,#a45a2e);color:#1c0f06;}
  .avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--elevated);flex-shrink:0;}
  .grow{flex:1;min-width:0;}
  .row-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--muted);}
  .row-val{font-family:'Barlow Condensed';font-weight:700;font-size:19px;}
  .poolbar{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--elevated);}
  .poolbar .a{background:linear-gradient(90deg,#2563eb,#3b82f6);}
  .poolbar .b{background:linear-gradient(90deg,#dc2626,#ef4444);}
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(13,18,30,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;}
  .navbtn{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-size:10px;font-weight:600;transition:color .15s;}
  .navbtn.active{color:var(--text);}
  .navbtn .ico{font-size:19px;line-height:1;}
  .navbtn.active .ico{filter:drop-shadow(0 0 8px var(--ice));}
  .stakegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stake{background:var(--elevated);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:20px;cursor:pointer;color:var(--text);}
  .stake.sel{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .teambtn{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);}
  .teambtn.sel{border-color:var(--ice);background:var(--ice-soft);}
  .backdrop{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--line);padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grabber{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--elevated);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
  .chip.active{background:var(--text);color:var(--ink);border-color:var(--text);}
  .pcard{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .pnum{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:17px;flex-shrink:0;color:#fff;}
  .pop-wrap{display:flex;align-items:center;gap:8px;}
  .pop-track{width:52px;height:6px;border-radius:99px;background:var(--elevated);overflow:hidden;}
  .pop-fill{height:100%;background:linear-gradient(90deg,var(--ice),#7dd3fc);}
  .price{font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:var(--gold);}
  .add-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--elevated);color:var(--text);font-size:19px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;font-family:'Barlow Condensed';}
  .add-btn.owned{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .add-btn:disabled{opacity:.35;cursor:not-allowed;}
  .rink{background:linear-gradient(180deg,#0e1830,#0a1122);border:1px solid var(--line);border-radius:18px;padding:18px 10px;position:relative;overflow:hidden;}
  .rink:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--red);opacity:.35;}
  .rink-line{display:flex;justify-content:center;gap:10px;margin:14px 0;position:relative;z-index:2;flex-wrap:wrap;}
  .slot{width:64px;text-align:center;cursor:pointer;}
  .slot .puckicon{width:44px;height:44px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;font-size:20px;border:2px solid rgba(255,255,255,.14);background:var(--elevated);}
  .slot.filled .puckicon{border-color:var(--ice);background:var(--ice-soft);}
  .slot small{font-size:10px;color:var(--muted);display:block;line-height:1.2;}
  .slot b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat .n{font-family:'Barlow Condensed';font-weight:700;font-size:26px;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.6px;}
  .ach{display:flex;gap:12px;align-items:center;padding:13px 14px;}
  .ach .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--elevated);flex-shrink:0;}
  .ach.locked{opacity:.4;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s;max-width:88%;text-align:center;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .banner{margin:14px 16px 0;padding:11px 14px;border-radius:12px;background:var(--ice-soft);border:1px solid rgba(56,189,248,.3);font-size:12.5px;color:#bfe3fb;display:flex;gap:9px;align-items:flex-start;}
  .tag-outcome{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .win{background:var(--green-soft);color:var(--green);}
  .lose{background:var(--red-soft);color:var(--red);}
  .open{background:var(--ice-soft);color:var(--ice);}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .muted{color:var(--muted);}
  .authwrap{min-height:100vh;display:flex;flex-direction:column;padding:0 22px 30px;}
  .authhero{padding:56px 0 26px;text-align:center;}
  .authlogo{width:66px;height:66px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--red),#8a1620);box-shadow:0 12px 40px -10px var(--red);}
  .authtitle{font-size:28px;font-weight:700;letter-spacing:-.6px;}
  .authsub{color:var(--muted);font-size:14px;margin-top:6px;}
  .authtabs{display:flex;background:var(--elevated);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;}
  .authtab{flex:1;padding:11px;border:none;background:none;color:var(--muted);font-weight:600;font-size:14px;border-radius:9px;cursor:pointer;}
  .authtab.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .codebox{font-family:'Barlow Condensed';font-size:26px;font-weight:700;letter-spacing:3px;text-align:center;background:var(--elevated);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--ice);}
  .copybtn{background:var(--elevated);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ============================================================
   HockeyPool Schweiz — Frontend-Prototyp
   Aufbau nach der Spezifikation. WICHTIG: In diesem statischen
   Prototyp läuft die Logik im Browser (Demo). In Produktion gehören
   Auth, Punkte, Fantasy-Preise, Tippfrist & NL-API auf einen SERVER
   (siehe Spec §39). Der Code ist bewusst modular gehalten.
   ============================================================ */

/* ---------- Persistenz (localStorage, mit Fallback) ---------- */
const mem = {};
const store = {
  read(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):(k in mem?mem[k]:def); }catch(e){ return (k in mem?mem[k]:def); } },
  write(k, val){ mem[k]=val; try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){} },
};

/* ---------- Helpers ---------- */
const fmt = n => Math.round(n).toLocaleString('de-CH');
const PRICE_CONFIG = { base:300, range:1700, exponent:1.3, roundTo:50 }; // Spec §21
function priceFromPopularity(score){
  const {base,range,exponent,roundTo}=PRICE_CONFIG;
  return Math.round((base+Math.pow(score/100,exponent)*range)/roundTo)*roundTo;
}
async function hashPw(pw){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'f'+pw.split('').reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7).toString(16); }
}
const CS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genCode = ()=> 'HOCKEY-'+Array.from({length:4},()=>CS[Math.floor(Math.random()*CS.length)]).join('');

/* ---------- Teams ---------- */
const TEAMS = {
  ZSC:{name:"ZSC Lions",short:"ZSC",color:"#2563eb",tag:"🦁"},
  SCB:{name:"SC Bern",short:"SCB",color:"#dc2626",tag:"🐻"},
  ZUG:{name:"EV Zug",short:"ZUG",color:"#0ea5e9",tag:"⚡"},
  DAV:{name:"HC Davos",short:"HCD",color:"#eab308",tag:"🏔️"},
  LAU:{name:"Lausanne HC",short:"LHC",color:"#1e40af",tag:"🦅"},
  FRI:{name:"Fribourg-Gottéron",short:"FRI",color:"#0f766e",tag:"🐉"},
  GSHC:{name:"Genève-Servette",short:"GSHC",color:"#7c1d1d",tag:"🦅"},
  BIE:{name:"EHC Biel",short:"BIE",color:"#eab308",tag:"🐝"},
};

/* ---------- Fiktive Spieler (keine realen Personendaten, Spec §17) ---------- */
let PID=0;
const mk=(fn,ln,team,pos,num,pop,fav,teams,potg,trend)=>({id:++PID,firstName:fn,lastName:ln,team,pos,num,pop,fav,teams,potg,trend});
const PLAYERS=[
  mk("Nino","Berger","ZSC","F",96,92,42,127,8,14),mk("Luca","Weber","SCB","F",71,88,31,98,5,9),
  mk("Elias","Moser","ZUG","F",29,84,22,86,4,11),mk("Timo","Frei","DAV","D",6,81,18,74,2,6),
  mk("Jan","Keller","LAU","F",17,79,15,69,3,-3),mk("Noah","Steiner","FRI","G",30,77,26,81,6,7),
  mk("Leon","Baumann","ZSC","D",44,74,11,58,1,4),mk("Simon","Roth","GSHC","F",22,71,9,52,2,-5),
  mk("Kevin","Meier","BIE","F",88,68,7,47,1,2),mk("Yves","Schmid","ZUG","G",1,66,14,61,3,3),
  mk("Marco","Graf","SCB","D",55,63,6,44,0,-2),mk("Fabio","Lehmann","DAV","F",93,59,5,39,1,5),
  mk("Sven","Widmer","LAU","D",8,54,4,33,0,1),mk("Dario","Huber","FRI","F",11,52,8,41,2,8),
  mk("Robin","Wyss","ZSC","G",35,49,10,45,1,-4),mk("Aaron","Suter","GSHC","D",21,46,3,28,0,2),
  mk("Colin","Bühler","BIE","D",4,43,2,22,0,-1),mk("Mika","Zimmermann","ZUG","F",67,41,3,26,1,6),
  mk("Dean","Fischer","DAV","F",19,38,2,19,0,-6),mk("Loris","Brunner","LAU","G",29,36,4,24,0,1),
  mk("Nael","Gerber","SCB","F",26,33,1,14,0,3),mk("Ryan","Marti","FRI","D",77,28,1,11,0,-2),
  mk("Levin","Kunz","GSHC","F",14,24,1,9,0,4),mk("Elia","Pfister","BIE","F",90,19,0,6,0,-8),
].map(p=>({...p,price:priceFromPopularity(p.pop)}));
const posLabel={G:"Torhüter",D:"Verteidiger",F:"Stürmer"};

/* ---------- Spiele ---------- */
const NOW=Date.now();
const GAMES=[
  {id:1,home:"ZSC",away:"SCB",start:NOW+55*60000,status:"OPEN",pool:{ZSC:350,SCB:750},tips:[{u:"Marco",t:"SCB",amt:500},{u:"Sarah",t:"ZSC",amt:100},{u:"Jonas",t:"SCB",amt:250}]},
  {id:2,home:"DAV",away:"ZUG",start:NOW+3*3600000,status:"OPEN",pool:{DAV:420,ZUG:180},tips:[{u:"Nina",t:"DAV",amt:120}]},
  {id:3,home:"LAU",away:"FRI",start:NOW+26*3600000,status:"OPEN",pool:{LAU:0,FRI:0},tips:[]},
  {id:4,home:"GSHC",away:"BIE",start:NOW+50*60000,status:"LIVE",hs:2,as:1,pool:{GSHC:600,BIE:400},tips:[{u:"Marco",t:"GSHC",amt:300}]},
  {id:5,home:"ZUG",away:"SCB",start:NOW-2*3600000,status:"FINISHED",hs:4,as:2,pool:{ZUG:900,SCB:300},tips:[]},
  {id:6,home:"FRI",away:"DAV",start:NOW-26*3600000,status:"FINISHED",hs:1,as:3,pool:{FRI:500,DAV:700},tips:[]},
];

/* ---------- Datenquelle NL (austauschbar, Spec §7) ----------
   In Produktion serverseitig! Ein echter Provider ruft die offizielle
   National-League/SIHF-API auf. Interface bleibt identisch. */
function createMockProvider(){
  return { async getGames(){ return new Promise(r=>setTimeout(()=>r(GAMES),350)); }, async getPlayers(){ return PLAYERS; } };
}
// function createHttpProvider(baseUrl){ return { async getGames(){ const r=await fetch(baseUrl+'/games'); return r.json(); } }; }
const NL = createMockProvider();

const ROSTER_RULES={G:2,D:5,F:8};
const START_BALANCE=10000;
const START_BUDGET=10000;
const ACHIEVEMENTS=[
  {icon:"🔥",name:"Hot Hand",desc:"5 richtige Tipps in Serie",key:"streak5"},
  {icon:"🎯",name:"Scharfschütze",desc:"10 richtige Tipps",key:"correct10"},
  {icon:"❤️",name:"Fan",desc:"Lieblingsspieler gewählt",key:"fav"},
  {icon:"🧠",name:"Fantasy Manager",desc:"Fantasy-Team vollständig",key:"fantasy"},
  {icon:"🏆",name:"Champion",desc:"Saison gewonnen",key:"champion"},
];

/* ============================================================
   "Backend"-Modul — in Produktion ein echter Server (Spec §39).
   Kapselt alle kritischen Aktionen an EINER Stelle.
   ============================================================ */
const db = {
  users(){ return store.read('hp_users',[]); },
  groups(){ return store.read('hp_groups',[]); },
  states(){ return store.read('hp_states',{}); },
  session(){ return store.read('hp_session',null); },
  saveUsers(u){ store.write('hp_users',u); },
  saveGroups(g){ store.write('hp_groups',g); },
  saveStates(s){ store.write('hp_states',s); },
  saveSession(id){ store.write('hp_session',id); },
};
const api = {
  currentUser(){ const id=db.session(); return db.users().find(u=>u.id===id)||null; },
  currentGroup(userId){ return db.groups().find(g=>g.memberIds.includes(userId))||null; },
  async register({username,email,password}){
    const users=db.users();
    if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())) throw new Error("Diese E-Mail ist bereits registriert.");
    if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())) throw new Error("Benutzername bereits vergeben.");
    const user={id:'u'+Date.now(),username,email,passHash:await hashPw(password),createdAt:Date.now()};
    db.saveUsers([...users,user]); db.saveSession(user.id);
    const states=db.states(); states[user.id]={balance:START_BALANCE,roster:[],favorite:null,tips:{},correct:0,streak:0}; db.saveStates(states);
    return user;
  },
  async login({identifier,password}){
    const users=db.users();
    const user=users.find(u=>u.email.toLowerCase()===identifier.toLowerCase()||u.username.toLowerCase()===identifier.toLowerCase());
    if(!user) throw new Error("Benutzer nicht gefunden.");
    if(user.passHash!==await hashPw(password)) throw new Error("Falsches Passwort.");
    db.saveSession(user.id); return user;
  },
  logout(){ db.saveSession(null); },
  createGroup(userId,name){
    const groups=db.groups();
    const g={id:'g'+Date.now(),name,code:genCode(),adminId:userId,memberIds:[userId],season:"National League 2026/27",createdAt:Date.now()};
    db.saveGroups([...groups,g]); return g;
  },
  joinGroup(userId,code){
    const groups=db.groups();
    const g=groups.find(x=>x.code.toUpperCase()===code.trim().toUpperCase());
    if(!g) throw new Error("Keine Gruppe mit diesem Code gefunden.");
    if(!g.memberIds.includes(userId)) g.memberIds.push(userId);
    db.saveGroups(groups); return g;
  },
  regenerateCode(groupId){ const groups=db.groups(); const g=groups.find(x=>x.id===groupId); g.code=genCode(); db.saveGroups(groups); return g.code; },
  getState(userId){ return db.states()[userId]||{balance:START_BALANCE,roster:[],favorite:null,tips:{},correct:0,streak:0}; },
  setState(userId,patch){ const s=db.states(); s[userId]={...s[userId],...patch}; db.saveStates(s); return s[userId]; },
  placeBet(userId,game,team,amt){
    const s=this.getState(userId);
    if(Date.now()>=game.start-60*60000) throw new Error("Tippfrist abgelaufen (60-Min-Regel).");
    if(amt<=0) throw new Error("Ungültiger Einsatz.");
    if(amt>s.balance) throw new Error("Nicht genug Guthaben.");
    return this.setState(userId,{balance:s.balance-amt,tips:{...s.tips,[game.id]:{t:team,amt}}});
  },
  addPlayer(userId,player){
    const s=this.getState(userId);
    if(s.roster.includes(player.id)) throw new Error("Spieler bereits im Team.");
    const counts={G:0,D:0,F:0}; s.roster.forEach(id=>counts[PLAYERS.find(p=>p.id===id).pos]++);
    if(counts[player.pos]>=ROSTER_RULES[player.pos]) throw new Error(`Maximal ${ROSTER_RULES[player.pos]} ${posLabel[player.pos]}.`);
    const spent=s.roster.reduce((a,id)=>a+PLAYERS.find(p=>p.id===id).price,0);
    if(spent+player.price>START_BUDGET) throw new Error("Fantasy-Budget überschritten.");
    return this.setState(userId,{roster:[...s.roster,player.id]});
  },
  removePlayer(userId,id){ const s=this.getState(userId); return this.setState(userId,{roster:s.roster.filter(x=>x!==id)}); },
  setFavorite(userId,id){ return this.setState(userId,{favorite:id}); },
};

/* ---------- kleine Bausteine ---------- */
function Crest({code,size=56}){const t=TEAMS[code];return <div className="crest" style={{width:size,height:size,background:t.color+"22",boxShadow:`inset 0 0 0 1px ${t.color}55`,fontSize:size*0.5}}>{t.tag}</div>;}
function StatusPill({s}){const m={OPEN:["open","🟢 Offen"],LOCKED:["locked","🔒 Zu"],LIVE:["live","● Live"],FINISHED:["done","Beendet"]};const[c,l]=m[s]||["done",s];return <span className={"pill "+c}>{l}</span>;}
function useCountdown(t){const[v,setV]=useState(t-Date.now());useEffect(()=>{const i=setInterval(()=>setV(t-Date.now()),1000);return()=>clearInterval(i);},[t]);return v;}
function fmtCd(ms){if(ms<=0)return"00:00:00";const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=x=>String(x).padStart(2,"0");return`${p(h)}:${p(m)}:${p(ss)}`;}
const lockTime=g=>g.start-60*60000;
const isOpen=g=>g.status==="OPEN"&&Date.now()<lockTime(g);
function Field({label,val,on,err,type="text",placeholder}){return <div className="field"><label>{label}</label><input className={"input "+(err?"err":"")} type={type} value={val} placeholder={placeholder} onChange={e=>on(e.target.value)} autoComplete="off"/>{err&&<div className="errmsg">{err}</div>}</div>;}
const L=({l,v,strong})=><div style={{display:"flex",justifyContent:"space-between",padding:"5px 0"}}><span className="muted" style={{fontSize:13}}>{l}</span><span className="mono" style={{fontWeight:700,fontSize:strong?18:15,color:strong?"var(--gold)":"var(--text)"}}>{v}</span></div>;
function Loading(){return <div style={{padding:"60px 0",textAlign:"center",color:"var(--muted)"}}><div style={{fontSize:30}}>🏒</div><div style={{marginTop:10,fontSize:13}}>Spiele werden geladen…</div></div>;}

/* ============ AUTH ============ */
function Auth({onDone,prefillJoin}){
  const [mode,setMode]=useState("register");
  const [f,setF]=useState({username:"",email:"",password:"",confirm:"",identifier:""});
  const [err,setErr]=useState({});
  const [busy,setBusy]=useState(false);
  const set=(k,v)=>{setF(s=>({...s,[k]:v}));setErr(e=>({...e,[k]:null,form:null}));};
  const submit=async()=>{
    const e={};
    if(mode==="register"){
      if(f.username.trim().length<3)e.username="Mind. 3 Zeichen.";
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email))e.email="Ungültige E-Mail.";
      if(f.password.length<6)e.password="Mind. 6 Zeichen.";
      if(f.password!==f.confirm)e.confirm="Passwörter stimmen nicht überein.";
    }else{ if(!f.identifier.trim())e.identifier="Bitte ausfüllen."; if(!f.password)e.password="Bitte ausfüllen."; }
    if(Object.keys(e).length){setErr(e);return;}
    setBusy(true);
    try{
      const user=mode==="register"?await api.register({username:f.username.trim(),email:f.email.trim(),password:f.password}):await api.login({identifier:f.identifier.trim(),password:f.password});
      onDone(user);
    }catch(ex){ setErr({form:ex.message}); }
    setBusy(false);
  };
  return (
    <div className="authwrap">
      <div className="authhero"><div className="authlogo">🏒</div><div className="authtitle">HockeyPool Schweiz</div><div className="authsub">Eine ganze Saison mit deinen Freunden.</div></div>
      {prefillJoin&&<div className="banner" style={{margin:"0 0 18px"}}>🎟️ <span>Du wurdest zu einer Gruppe eingeladen (Code <b>{prefillJoin}</b>). Erstelle ein Konto, um beizutreten.</span></div>}
      <div className="authtabs">
        <button className={"authtab "+(mode==="register"?"active":"")} onClick={()=>{setMode("register");setErr({});}}>Registrieren</button>
        <button className={"authtab "+(mode==="login"?"active":"")} onClick={()=>{setMode("login");setErr({});}}>Anmelden</button>
      </div>
      {mode==="register"?<>
        <Field label="Benutzername" val={f.username} on={v=>set("username",v)} err={err.username} placeholder="z.B. luca_w"/>
        <Field label="E-Mail" val={f.email} on={v=>set("email",v)} err={err.email} placeholder="du@example.ch" type="email"/>
        <Field label="Passwort" val={f.password} on={v=>set("password",v)} err={err.password} type="password" placeholder="Mind. 6 Zeichen"/>
        <Field label="Passwort bestätigen" val={f.confirm} on={v=>set("confirm",v)} err={err.confirm} type="password"/>
      </>:<>
        <Field label="E-Mail oder Benutzername" val={f.identifier} on={v=>set("identifier",v)} err={err.identifier}/>
        <Field label="Passwort" val={f.password} on={v=>set("password",v)} err={err.password} type="password"/>
      </>}
      {err.form&&<div className="errmsg" style={{marginBottom:10}}>⚠️ {err.form}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?"Bitte warten…":(mode==="register"?"Konto erstellen":"Anmelden")}</button>
      <p className="muted" style={{fontSize:11.5,textAlign:"center",marginTop:16,lineHeight:1.5}}>Demo-Konto: Daten werden nur in deinem Browser gespeichert. In der echten Version läuft die Anmeldung sicher über einen Server.</p>
    </div>
  );
}

  const [mode,setMode]=useState(prefillJoin?"join":null);
  const [name,setName]=useState("");
  const [code,setCode]=useState(prefillJoin||"");
  const [err,setErr]=useState(null);
  const create=()=>{ if(name.trim().length<3){setErr("Gruppenname mind. 3 Zeichen.");return;} onDone(api.createGroup(user.id,name.trim())); };
  const join=()=>{ try{ onDone(api.joinGroup(user.id,code)); }catch(e){ setErr(e.message); } };
  return (
    <div className="authwrap">
      <div className="authhero" style={{paddingTop:44}}><div className="authlogo" style={{background:"linear-gradient(135deg,#1c2740,#0f1626)"}}>👋</div><div className="authtitle">Willkommen, {user.username}</div><div className="authsub">Erstelle eine private Gruppe oder tritt einer bei.</div></div>
      {!mode&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <button className="card" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>{setMode("create");setErr(null);}}><div style={{fontSize:26,marginBottom:6}}>🏒</div><div style={{fontWeight:700,fontSize:16}}>Neue Gruppe erstellen</div><div className="muted" style={{fontSize:13,marginTop:2}}>Du wirst Admin und lädst deine Freunde per Code ein.</div></button>
        <button className="card" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>{setMode("join");setErr(null);}}><div style={{fontSize:26,marginBottom:6}}>🎟️</div><div style={{fontWeight:700,fontSize:16}}>Gruppe beitreten</div><div className="muted" style={{fontSize:13,marginTop:2}}>Mit einem Einladungscode wie HOCKEY-82KF.</div></button>
      </div>}
      {mode==="create"&&<div><Field label="Gruppenname" val={name} on={v=>{setName(v);setErr(null);}} err={err} placeholder="z.B. Hockeyrunde Wallis"/><button className="btn btn-primary" onClick={create}>Gruppe erstellen</button><button className="link" style={{display:"block",margin:"14px auto 0"}} onClick={()=>setMode(null)}>Zurück</button></div>}
      {mode==="join"&&<div><Field label="Einladungscode" val={code} on={v=>{setCode(v.toUpperCase());setErr(null);}} err={err} placeholder="HOCKEY-XXXX"/><button className="btn btn-primary" onClick={join}>Beitreten</button><button className="link" style={{display:"block",margin:"14px auto 0"}} onClick={()=>setMode(null)}>Zurück</button></div>}
    </div>
  );

/* ============ MAIN ============ */
function Main({user,group,state,refresh,onLogout,toast,setGroup}){
  const [tab,setTab]=useState("home");
  const [tipGame,setTipGame]=useState(null);
  const [playerId,setPlayerId]=useState(null);
  const confirmTip=(g,team,amt)=>{ try{ api.placeBet(user.id,g,team,amt); g.pool[team]=(g.pool[team]||0)+amt; g.tips=[...g.tips,{u:user.username,t:team,amt}]; refresh(); setTipGame(null); toast(`Tipp abgegeben: ${fmt(amt)} auf ${TEAMS[team].short}`);}catch(e){toast("⚠️ "+e.message);} };
  const addPlayer=p=>{ try{api.addPlayer(user.id,p);refresh();toast(`${p.lastName} ins Team ✓`);}catch(e){toast("⚠️ "+e.message);} };
  const removePlayer=id=>{ api.removePlayer(user.id,id); refresh(); };
  const setFav=id=>{ api.setFavorite(user.id,id); refresh(); };
  return (
    <div className="app">
      <div className="topbar"><div className="brand"><span className="puck">🏒</span> HockeyPool</div><div className="balance-chip"><span className="dot"></span> {fmt(state.balance)}</div></div>
      {tab==="home"&&<Dashboard user={user} group={group} state={state} go={setTab} openTip={setTipGame}/>}
      {tab==="games"&&<Games state={state} openTip={setTipGame}/>}
      {tab==="fantasy"&&<Fantasy state={state} add={addPlayer} remove={removePlayer} openPlayer={setPlayerId}/>}
      {tab==="rank"&&<Ranking group={group} user={user}/>}
      {tab==="profile"&&<Profile user={user} group={group} state={state} openPlayer={setPlayerId} onLogout={onLogout} setGroup={setGroup} toast={toast}/>}
      <div className="bottomnav">{[["home","🏠","Übersicht"],["games","🏒","Spiele"],["fantasy","🧠","Fantasy"],["rank","🏆","Rangliste"],["profile","👤","Profil"]].map(([k,ic,l])=><button key={k} className={"navbtn "+(tab===k?"active":"")} onClick={()=>setTab(k)}><span className="ico">{ic}</span>{l}</button>)}</div>
      {tipGame&&<TipSheet g={tipGame} balance={state.balance} onClose={()=>setTipGame(null)} onConfirm={confirmTip}/>}
      {playerId&&<PlayerSheet id={playerId} state={state} add={addPlayer} remove={removePlayer} setFav={setFav} onClose={()=>setPlayerId(null)}/>}
    </div>
  );
}

  if(!games) return <Loading/>;
  const list=games.filter(g=>filter==="open"?(g.status==="OPEN"||g.status==="LIVE"):filter==="done"?g.status==="FINISHED":true);

    <div>

    </div>
  );
}

function TipSheet({g,balance,onClose,onConfirm}){
  const [team,setTeam]=useState(null),[amt,setAmt]=useState(null),[custom,setCustom]=useState(""),[step,setStep]=useState(1);
  const stake=custom!==""?parseInt(custom||0,10):amt;
  const valid=team&&stake>0&&stake<=balance;
  return (
    <div className="backdrop" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grabber"></div>
      {step===1?<>
        <div style={{textAlign:"center",marginBottom:16}}><div className="eyebrow">Wer gewinnt?</div><div style={{fontWeight:700,fontSize:17,marginTop:4}}>{TEAMS[g.home].name} vs. {TEAMS[g.away].name}</div></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>{[g.home,g.away].map(c=><button key={c} className={"teambtn "+(team===c?"sel":"")} onClick={()=>setTeam(c)}><Crest code={c} size={44}/><div style={{fontWeight:600,fontSize:13,textAlign:"center"}}>{TEAMS[c].name}</div></button>)}</div>
        <div className="eyebrow" style={{marginBottom:8}}>Einsatz</div>
        <div className="stakegrid" style={{marginBottom:10}}>{[10,25,50,100,250,500].map(v=><button key={v} className={"stake "+(amt===v&&custom===""?"sel":"")} onClick={()=>{setAmt(v);setCustom("");}}>{v}</button>)}</div>
        <input inputMode="numeric" className="input" placeholder="Eigener Betrag" value={custom} onChange={e=>{setCustom(e.target.value.replace(/\D/g,""));setAmt(null);}} style={{marginBottom:14}}/>
        <div className="card" style={{background:"var(--elevated)",marginBottom:14}}><L l="Aktuelles Guthaben" v={fmt(balance)}/><L l="Einsatz" v={stake?fmt(stake):"–"}/><div className="divider" style={{margin:"10px 0"}}></div><L l="Verbleibend" v={stake?fmt(balance-stake):fmt(balance)} strong/></div>
        {stake>balance&&<div className="errmsg" style={{marginBottom:10}}>Nicht genug Guthaben.</div>}
        <button className="btn btn-primary" disabled={!valid} onClick={()=>setStep(2)}>Weiter</button>
      </>:<>
        <div style={{textAlign:"center",padding:"10px 0 20px"}}><div style={{fontSize:40,marginBottom:8}}>{TEAMS[team].tag}</div><div style={{fontSize:18,fontWeight:700}}>Du setzt {fmt(stake)} Punkte</div><div className="muted" style={{marginTop:4}}>auf {TEAMS[team].name}</div></div>
        <div style={{display:"flex",gap:10}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setStep(1)}>Abbrechen</button><button className="btn btn-primary" style={{flex:1}} onClick={()=>onConfirm(g,team,stake)}>Bestätigen</button></div>
      </>}
    </div></div>
  );
}

function Fantasy({state,add,remove,openPlayer}){
  const [tab,setTab]=useState("team");
  const spent=state.roster.reduce((s,id)=>s+PLAYERS.find(p=>p.id===id).price,0);
  const left=START_BUDGET-spent;
  const counts={G:0,D:0,F:0}; state.roster.forEach(id=>counts[PLAYERS.find(p=>p.id===id).pos]++);
  return (
    <div>
      <div className="section" style={{paddingTop:18}}><h1 style={{fontSize:24,fontWeight:700}}>Fantasy</h1></div>
      <div className="section" style={{paddingTop:4}}><div className="card" style={{display:"flex",justifyContent:"space-between"}}><div><div className="eyebrow">Budget</div><div className="mono" style={{fontSize:22,fontWeight:700}}>{fmt(START_BUDGET)}</div></div><div style={{textAlign:"center"}}><div className="eyebrow">Ausgegeben</div><div className="mono" style={{fontSize:22,fontWeight:700}}>{fmt(spent)}</div></div><div style={{textAlign:"right"}}><div className="eyebrow">Übrig</div><div className="mono" style={{fontSize:22,fontWeight:700,color:left<0?"var(--red)":"var(--green)"}}>{fmt(left)}</div></div></div></div>
      <div className="section" style={{paddingTop:8,paddingBottom:8}}><div className="chips">{[["team","🧠 Mein Team"],["market","🔄 Markt"],["transfers","📈 Transfermarkt"]].map(([k,l])=><button key={k} className={"chip "+(tab===k?"active":"")} onClick={()=>setTab(k)}>{l}</button>)}</div></div>
      {tab==="team"&&<TeamView state={state} counts={counts} openPlayer={openPlayer}/>}
      {tab==="market"&&<Market state={state} counts={counts} left={left} add={add} remove={remove} openPlayer={openPlayer}/>}
      {tab==="transfers"&&<Transfers openPlayer={openPlayer}/>}
    </div>
  );
}
function TeamView({state,counts,openPlayer}){
  const get=pos=>state.roster.map(id=>PLAYERS.find(p=>p.id===id)).filter(p=>p.pos===pos);
  const Slot=({p,pos})=><div className={"slot "+(p?"filled":"")} onClick={()=>p&&openPlayer(p.id)}><div className="puckicon">{p?"🏒":(pos==="G"?"🥅":"＋")}</div>{p?<><b>{p.lastName}</b><small>{TEAMS[p.team].short} · {fmt(p.price)}</small></>:<small>{posLabel[pos]}</small>}</div>;
  const line=pos=>{const f=get(pos),t=ROSTER_RULES[pos];return[...f,...Array(Math.max(0,t-f.length)).fill(null)].map((p,i)=><Slot key={i} p={p} pos={pos}/>);};
  const complete=counts.G===ROSTER_RULES.G&&counts.D===ROSTER_RULES.D&&counts.F===ROSTER_RULES.F;
  return (
    <div className="section" style={{paddingBottom:20}}>
      <div className="rink">
        <div className="eyebrow" style={{textAlign:"center",marginBottom:6}}>Torhüter {counts.G}/{ROSTER_RULES.G}</div><div className="rink-line">{line("G")}</div>
        <div className="eyebrow" style={{textAlign:"center",marginBottom:6}}>Verteidigung {counts.D}/{ROSTER_RULES.D}</div><div className="rink-line">{line("D")}</div>
        <div className="eyebrow" style={{textAlign:"center",marginBottom:6}}>Sturm {counts.F}/{ROSTER_RULES.F}</div><div className="rink-line">{line("F")}</div>
      </div>
      {complete&&<div className="banner" style={{marginLeft:0,marginRight:0,background:"var(--green-soft)",borderColor:"rgba(47,191,113,.3)",color:"#bff0d4"}}>🧠 <span>Team vollständig! Erfolg „Fantasy Manager" freigeschaltet.</span></div>}
      <div className="banner" style={{marginLeft:0,marginRight:0}}>ℹ️ <span>Öffne den <b>Markt</b>, um Spieler hinzuzufügen. Budget, Position und Anzahl werden geprüft.</span></div>
    </div>
  );
}
function Market({state,counts,left,add,remove,openPlayer}){
  const [pos,setPos]=useState("all");
  const list=PLAYERS.filter(p=>pos==="all"||p.pos===pos).sort((a,b)=>b.pop-a.pop);
  return (
    <div className="section" style={{paddingBottom:20}}>
      <div className="chips" style={{marginBottom:12}}>{[["all","Alle"],["G","Torhüter"],["D","Verteidiger"],["F","Stürmer"]].map(([k,l])=><button key={k} className={"chip "+(pos===k?"active":"")} onClick={()=>setPos(k)}>{l}</button>)}</div>
      <div className="rowlist">{list.map(p=>{const owned=state.roster.includes(p.id);const disabled=!owned&&(counts[p.pos]>=ROSTER_RULES[p.pos]||p.price>left);return <div className="row pcard" key={p.id}><div className="pnum" style={{background:TEAMS[p.team].color}} onClick={()=>openPlayer(p.id)}>{p.num}</div><div className="grow" onClick={()=>openPlayer(p.id)}><div className="row-title">{p.firstName} {p.lastName}</div><div className="pop-wrap"><div className="pop-track"><div className="pop-fill" style={{width:p.pop+"%"}}></div></div><span className="row-sub">Beliebtheit {p.pop}</span></div></div><div style={{textAlign:"right",marginRight:4}}><div className="price">{fmt(p.price)}</div><div className="row-sub" style={{color:p.trend>=0?"var(--green)":"var(--red)"}}>{p.trend>=0?"▲":"▼"} {Math.abs(p.trend)}%</div></div><button className={"add-btn "+(owned?"owned":"")} disabled={disabled} onClick={()=>owned?remove(p.id):add(p)}>{owned?"✓":"＋"}</button></div>;})}</div>
    </div>
  );
}
function Transfers({openPlayer}){
  const risers=[...PLAYERS].sort((a,b)=>b.trend-a.trend).slice(0,3);
  const fallers=[...PLAYERS].sort((a,b)=>a.trend-b.trend).slice(0,3);
  const popular=[...PLAYERS].sort((a,b)=>b.teams-a.teams).slice(0,3);
  const Block=({title,arr,fn,color})=><div className="section" style={{paddingTop:0}}><div className="section-head"><h2 style={{fontSize:15}}>{title}</h2></div><div className="rowlist">{arr.map(p=><div className="row" key={p.id} onClick={()=>openPlayer(p.id)}><div className="pnum" style={{width:32,height:32,fontSize:14,background:TEAMS[p.team].color}}>{p.num}</div><div className="grow"><div className="row-title">{p.firstName} {p.lastName}</div><div className="row-sub">{TEAMS[p.team].short}</div></div><div className="mono" style={{fontWeight:700,color}}>{fn(p)}</div></div>)}</div></div>;
  return <div style={{paddingBottom:20}}><Block title="📈 Grösste Aufsteiger" arr={risers} fn={p=>"+"+p.trend+"%"} color="var(--green)"/><Block title="📉 Grösste Verlierer" arr={fallers} fn={p=>p.trend+"%"} color="var(--red)"/><Block title="🔥 Meistgewählt" arr={popular} fn={p=>p.teams+" Teams"} color="var(--gold)"/></div>;
}

function Ranking({group,user}){
  const [tab,setTab]=useState("tips");
  const real=group.memberIds.map(id=>{const u=db.users().find(x=>x.id===id);const s=api.getState(id);return{name:u?u.username:"?",me:id===user.id,pts:s.balance,fantasy:s.roster.reduce((a,pid)=>a+PLAYERS.find(p=>p.id===pid).price,0),streak:s.streak||0};});
  const demo=[{name:"Marco",pts:8120,fantasy:9200,streak:2},{name:"Sarah",pts:7950,fantasy:8800,streak:3},{name:"Jonas",pts:7500,fantasy:9100,streak:0},{name:"Nina",pts:7180,fantasy:8400,streak:4}];
  const all=[...real,...demo];
  const cfg={tips:{key:"pts",suf:""},fantasy:{key:"fantasy",suf:""},streak:{key:"streak",suf:" Siege"}}[tab];
  const data=[...all].sort((a,b)=>b[cfg.key]-a[cfg.key]);
  return (
    <div>
      <div className="section" style={{paddingTop:18}}><h1 style={{fontSize:24,fontWeight:700}}>Rangliste</h1></div>
      <div className="section" style={{paddingTop:4,paddingBottom:8}}><div className="chips">{["tips","fantasy","streak"].map(k=><button key={k} className={"chip "+(tab===k?"active":"")} onClick={()=>setTab(k)}>{{tips:"🏆 Tipps",fantasy:"🧠 Fantasy",streak:"🔥 Serie"}[k]}</button>)}</div></div>
      <div className="section" style={{paddingBottom:20}}><div className="rowlist">{data.map((m,i)=><div className="row" key={i}><div className={"rank-badge "+(i<3?"g"+(i+1):"")}>{i+1}</div><div className="avatar" style={{background:m.me?"var(--red-soft)":"var(--elevated)",color:m.me?"var(--red)":"var(--text)"}}>{m.name[0].toUpperCase()}</div><div className="grow"><div className="row-title">{m.name}{m.me&&" (Du)"}</div></div><div className="row-val">{fmt(m[cfg.key])}{cfg.suf}</div></div>)}</div></div>
    </div>
  );
}

function Profile({user,group,state,openPlayer,onLogout,setGroup,toast}){
  const fav=state.favorite?PLAYERS.find(p=>p.id===state.favorite):null;
  const isAdmin=group.adminId===user.id;
  const [code,setCode]=useState(group.code);
  const copy=t=>{try{navigator.clipboard.writeText(t);toast("Kopiert ✓");}catch(e){toast(t);}};
  const regen=()=>{const c=api.regenerateCode(group.id);setCode(c);setGroup({...group,code:c});toast("Neuer Code erzeugt");};
  const link=location.origin+location.pathname+"#/join/"+code;
  return (
    <div>
      <div className="section" style={{paddingTop:22,textAlign:"center"}}><div className="avatar" style={{width:74,height:74,fontSize:30,margin:"0 auto 12px",borderRadius:22,background:"linear-gradient(135deg,var(--red),#8a1620)"}}>{user.username[0].toUpperCase()}</div><h1 style={{fontSize:22,fontWeight:700}}>{user.username}</h1><div className="muted" style={{fontSize:13}}>{user.email}</div></div>
      <div className="section"><div className="statgrid"><div className="stat"><div className="n">{fmt(state.balance)}</div><div className="l">Tipp-Guthaben</div></div><div className="stat"><div className="n">{state.streak||0}</div><div className="l">Serie 🔥</div></div><div className="stat"><div className="n">{Object.keys(state.tips).length}</div><div className="l">Getippte Spiele</div></div><div className="stat"><div className="n">{state.roster.length}</div><div className="l">Fantasy-Spieler</div></div></div></div>
      <div className="section"><div className="section-head"><h2>👥 Gruppe</h2>{isAdmin&&<span className="pill open">Admin</span>}</div><div className="card"><div style={{fontWeight:700,marginBottom:2}}>{group.name}</div><div className="row-sub" style={{marginBottom:12}}>{group.season} · {group.memberIds.length} Mitglied(er)</div><div className="eyebrow" style={{marginBottom:6}}>Einladungscode</div><div className="codebox" style={{marginBottom:10}}>{code}</div><div style={{display:"flex",gap:8}}><button className="copybtn" style={{flex:1}} onClick={()=>copy(code)}>Code kopieren</button><button className="copybtn" style={{flex:1}} onClick={()=>copy(link)}>Link kopieren</button>{isAdmin&&<button className="copybtn" onClick={regen}>↻ Neu</button>}</div></div></div>
      <div className="section"><div className="section-head"><h2>❤️ Lieblingsspieler</h2></div>{fav?<div className="card" style={{display:"flex",alignItems:"center",gap:12}} onClick={()=>openPlayer(fav.id)}><div className="pnum" style={{width:44,height:44,fontSize:18,background:TEAMS[fav.team].color}}>{fav.num}</div><div className="grow"><div style={{fontWeight:700}}>{fav.firstName} {fav.lastName}</div><div className="row-sub">{TEAMS[fav.team].name} · {fav.fav} Fans</div></div><span style={{fontSize:22}}>❤️</span></div>:<div className="card muted" style={{textAlign:"center",fontSize:13}}>Noch keinen Lieblingsspieler gewählt. Öffne einen Spieler im Markt.</div>}</div>
      <div className="section"><div className="section-head"><h2>Erfolge</h2></div><div className="rowlist">{ACHIEVEMENTS.map(a=>{const got=a.key==="fav"?!!state.favorite:a.key==="fantasy"?state.roster.length===15:false;return <div className={"row ach "+(got?"":"locked")} key={a.name}><div className="ico">{a.icon}</div><div className="grow"><div className="row-title">{a.name}</div><div className="row-sub">{a.desc}</div></div>{got&&<span style={{color:"var(--green)"}}>✓</span>}</div>;})}</div></div>
      <div className="section" style={{paddingBottom:20}}><button className="btn btn-ghost" onClick={onLogout}>Abmelden</button></div>
    </div>
  );
}

function PlayerSheet({id,state,add,remove,setFav,onClose}){
  const p=PLAYERS.find(x=>x.id===id);
  const owned=state.roster.includes(p.id);
  const isFav=state.favorite===p.id;
  return (
    <div className="backdrop" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grabber"></div>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}><div className="pnum" style={{width:54,height:54,fontSize:22,background:TEAMS[p.team].color}}>{p.num}</div><div><div style={{fontWeight:700,fontSize:20}}>{p.firstName} {p.lastName}</div><div className="muted">{TEAMS[p.team].name} · {posLabel[p.pos]}</div></div></div>
      <div className="statgrid" style={{marginBottom:14}}><div className="stat"><div className="n" style={{color:"var(--ice)"}}>{p.pop}<span style={{fontSize:14,color:"var(--muted)"}}>/100</span></div><div className="l">Popularity Score</div></div><div className="stat"><div className="n" style={{color:"var(--gold)"}}>{fmt(p.price)}</div><div className="l">Fantasy-Preis</div></div><div className="stat"><div className="n">{p.teams}</div><div className="l">Fantasy-Teams</div></div><div className="stat"><div className="n">{p.fav} ❤️</div><div className="l">Lieblingsspieler</div></div></div>
      <div className="card" style={{background:"var(--elevated)",marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span className="muted">Trend diese Woche</span><span style={{fontWeight:700,color:p.trend>=0?"var(--green)":"var(--red)"}}>{p.trend>=0?"▲ +":"▼ "}{p.trend}%</span></div><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginTop:8}}><span className="muted">Spieler des Spiels</span><span style={{fontWeight:700}}>{p.potg}×</span></div></div>
      <div style={{display:"flex",gap:10}}><button className={"btn "+(isFav?"btn-primary":"btn-ghost")} style={{flex:1}} onClick={()=>setFav(isFav?null:p.id)}>{isFav?"❤️ Liebling":"♡ Als Liebling"}</button><button className={"btn "+(owned?"btn-ghost":"btn-primary")} style={{flex:1}} onClick={()=>owned?remove(p.id):add(p)}>{owned?"− Entfernen":"＋ Ins Team"}</button></div>
    </div></div>
  );
}

/* ============ ROOT ============ */
function Root(){
  const [tick,setTick]=useState(0);
  const refresh=()=>setTick(t=>t+1);
  const [user,setUser]=useState(()=>api.currentUser());
  const [group,setGroup]=useState(()=>user?api.currentGroup(user.id):null);
  const [toastMsg,setToastMsg]=useState(null);
  const toast=m=>{setToastMsg(m);setTimeout(()=>setToastMsg(null),2000);};
  const prefillJoin=useMemo(()=>{const m=location.hash.match(/#\/join\/([A-Z0-9-]+)/i);return m?m[1].toUpperCase():null;},[]);
  const state=user?api.getState(user.id):null;
  const onAuth=u=>{ setUser(u); const g=api.currentGroup(u.id); setGroup(g); if(g)refresh(); };
  const onOnboard=g=>{ setGroup(g); refresh(); };
  const onLogout=()=>{ api.logout(); setUser(null); setGroup(null); };
  if(!user) return <><Auth onDone={onAuth} prefillJoin={prefillJoin}/>{toastMsg&&<div className="toast">{toastMsg}</div>}</>;
  if(!group) return <><Onboarding user={user} onDone={onOnboard} prefillJoin={prefillJoin}/>{toastMsg&&<div className="toast">{toastMsg}</div>}</>;
  return <><Main key={tick} user={user} group={group} state={state} refresh={refresh} onLogout={onLogout} toast={toast} setGroup={setGroup}/>{toastMsg&&<div className="toast">{toastMsg}</div>}</>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
